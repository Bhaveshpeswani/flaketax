name: tests
on:
  push:
    pull_request:
      jobs:
        verify:
          runs-on: ubuntu-latest
          steps:
            -users: actions/checkout@v4
            -uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: '21'
              cache: maven
            -name: Unit and PostgreSQL integration tests
            run: mvn -B verify
