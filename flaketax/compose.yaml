services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flaketax
      POSTGRES_USER: flaketax
      POSTGRES_PASSWORD: flaketax
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flaketax -d flaketax"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
      build: .
      environment:
        DB_URL: jdbc:postgresql://db:5432/flaketax
        DB_USER: flaketax
        DB_PASSWORD: flaketax
      ports:
        - "127.0.0.1:8080:8080"
      depends_on:
        db:
           condition: service_healthy

volumes:
  db_data:
